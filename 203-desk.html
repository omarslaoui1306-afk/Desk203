:root{
  --screen:#000;
  --amber:#FFA31A;
  --amber-dim:#8A5A12;
  --paper:#ECE8DF;
  --muted:#8E929A;
  --line:#2A2E35;
  --line-soft:#1A1D22;
  --bar:#15335E;
  --bar-hi:#1E4680;
  --key:#F5C518;
  --key-edge:#9C7A06;
  --up:#27D07A;
  --down:#FF5247;
  --lift:rgba(255,255,255,.035);
  --f-term:'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --f-body:'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-math:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{background:var(--screen);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--screen);color:var(--paper);font:400 17px/1.55 var(--f-body);
  -webkit-font-smoothing:antialiased;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
sup,sub{font-size:.72em;line-height:0}
.wrap{max-width:720px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 120px)}
.term{font-family:var(--f-term)}
.muted{color:var(--muted)}

/* ---------- ticker ---------- */
.ticker{position:sticky;top:0;z-index:20;background:var(--screen);border-bottom:1px solid var(--line);
  overflow:hidden;white-space:nowrap;margin:0 -16px;padding-top:var(--safe-t)}
.ticker-track{display:inline-flex;gap:0;animation:tick 48s linear infinite;will-change:transform}
.tick{font:500 13px/34px var(--f-term);font-stretch:87.5%;padding:0 18px;border-right:1px solid var(--line-soft);display:inline-flex;gap:8px;align-items:center}
.tick b{color:var(--amber);font-weight:600}
.tick .v{color:var(--paper)}
.tri{display:inline-block;width:9px;height:8px}

<script>

(function(){

  return {prog:{},mode:'theme',diff:'Tous',session:null};
}

/* ================= cards ================= */

BRAIN.brain.forEach(c=>CARDS.set(c.id, Object.assign({type:'brain', theme:'brain'}, c)));

/* ================= router ================= */
function go(hash){ if(location.hash===hash) render(); else location.hash = hash; }

function render(){
  const h = location.hash || '#/';
  window.scrollTo(0,0);
  if(h.startsWith('#/s/')) return renderSection(decodeURIComponent(h.slice(4)));
  if(h==='#/play') return S.session ? renderPlay(true) : go('#/');
  if(h==='#/done') return renderSummary();
  renderHub();
}

      </div>

    ${sess ? `<button class="resume" data-act="resume"><div><div class="r1">Reprendre la séance</div><div class="r2">${esc(sess.title)} — carte ${Math.min(S.session.i+1,S.session.queue.length)} sur ${S.session.queue.length}</div></div>${tri('up')}</button>` : ''}
    <nav class="fkeys" aria-label="Mode de navigation">
      ${[['theme','F1','Par thème'],['desk','F2','Par desk'],['brain','F3','Brainteasers']].map(([m,f,l])=>`<button class="fkey" data-act="mode" data-mode="${m}" aria-pressed="${mode===m}"><span class="fn">${f}</span><span class="lb">${l}</span></button>`).join('')}
    </nav>
    <div class="grid">${list.map(panelHTML).join('')}</div>
    <footer class="hub-foot">

      <button class="link-btn" data-act="reset-all">Tout réinitialiser</button>

}
function panelHTML(s){

    <div class="pbar"><i data-w="${p.pct}"></i></div>
  </button>`;
}

/* ================= section ================= */
function sectionPool(s){
  if(s.filter && S.diff !== 'Tous') return s.cards.filter(id=>CARDS.get(id).level===S.diff);
  return s.cards;
}

  APP.innerHTML = `

    ${s.filter ? `<div class="chips" role="group" aria-label="Difficulté">${levels.map(l=>{ const n = l==='Tous'? s.cards.length : s.cards.filter(id=>CARDS.get(id).level===l).length; return `<button class="chip" data-act="diff" data-diff="${l}" aria-pressed="${S.diff===l}">${l}<span class="n">${n}</span></button>`; }).join('')}</div>` : ''}
    <div class="plays">
      <button class="play primary" data-act="start" data-mode="all" ${pool.length?'':'disabled'}><span class="pk">ALL</span><span><div class="pt">Tout le programme</div><div class="pd">Toutes les cartes, mélangées</div></span><span class="pn">${pool.length}</span></button>
      <button class="play" data-act="start" data-mode="errors" ${errs?'':'disabled'}><span class="pk" style="color:var(--down)">ERR</span><span><div class="pt">Mes erreurs</div><div class="pd">${errs? 'Uniquement les cartes marquées pas su' : 'Aucune erreur enregistrée ici'}</div></span><span class="pn">${errs}</span></button>
      <button class="play" data-act="start" data-mode="blitz" ${pool.length?'':'disabled'}><span class="pk" style="color:var(--amber)">BLZ</span><span><div class="pt">Blitz</div><div class="pd">10 cartes rapides, erreurs et nouveautés d’abord</div></span><span class="pn">${Math.min(10,pool.length)}</span></button>

      <div class="fold-body"><ul class="cardlist">${pool.map(id=>{ const c=CARDS.get(id); const st=stat(id); return `<li><button data-act="study" data-id="${esc(id)}"><i class="dot ${st||''}"></i><span class="nm">${esc(cardName(c))}</span><span class="ty">${c.type==='brain'?esc(c.level):TYPE_LABEL[c.type]}</span></button></li>`; }).join('')}</ul></div>
    </details>
    ${s.mode!=='brain' ? `<details class="fold"><summary>Questions posées en vrai entretien<span class="cnt">${qCount}</span><i class="chev"></i></summary>

      ${s.questions.map(g=>`<div class="qgroup"><h4>${esc(g.group)}<span>${esc(g.desk)}</span></h4><ol>${g.questions.map(q=>`<li><span class="qn">${esc(q.n)}</span><span>${esc(q.q)}</span></li>`).join('')}</ol></div>`).join('')}

/* ================= sessions ================= */
function priority(id){ const s=stat(id); return s==='u'?0 : s===null?1 : 2; }
function startSession(key, mode, single){
  const s = SECTIONS.get(key); const pool = sectionPool(s);
  let queue;
  if(single) queue=[single];
  else if(mode==='errors') queue = shuffle(pool.filter(id=>stat(id)==='u'));
  else if(mode==='blitz') queue = shuffle(pool).sort((a,b)=>priority(a)-priority(b)).slice(0,10);
  else queue = shuffle(pool);
  if(!queue.length) return;
  S.session = {key, mode: single?'study':mode, title:s.title, queue, i:0, revealed:false, choice:null, res:{}, order:{}, t0:Date.now()};
  save(); go('#/play');
}
function currentCard(){ const ss=S.session; return CARDS.get(ss.queue[ss.i]); }

/* ================= play ================= */
let clockTimer = null;
function renderPlay(enter){
  const ss = S.session; const c = currentCard();
  if(!c){ S.session=null; save(); return go('#/'); }
  const sec = SECTIONS.get(ss.key);
  const done = Object.values(ss.res); const k = done.filter(x=>x==='k').length, u = done.filter(x=>x==='u').length;
  const pos = ss.i + 1, n = ss.queue.length;
  APP.innerHTML = `
  <div class="wrap">
    <div class="playbar">
      <div class="row">
        <button class="iconbtn" data-act="quit" aria-label="Quitter la séance">${ICON.close}</button>
        <span class="counter"><b>${pos}</b> / ${n}</span>
        ${ss.mode==='blitz'?'<span class="clock" id="clock">00:00</span>':''}
        <span class="grow"></span>
        <span class="score" aria-label="${k} sues, ${u} pas sues"><span style="color:var(--up)">${tri('up')}${k}</span><span style="color:var(--down)">${tri('down')}${u}</span></span>
      </div>
      <div class="pbar thin"><i data-w="${Math.round(100*ss.i/n)}"></i></div>
    </div>
    <div class="stage">${cardHTML(c, ss, sec, enter)}</div>
  </div>
  <div class="dock"><div class="dock-in ${dockTwo(c,ss)?'two':''}">${dockHTML(c, ss)}</div></div>`;
  const bar = APP.querySelector('.playbar .pbar i'); bar.style.transition='none'; bar.style.width = Math.round(100*Math.max(0,ss.i-1)/n)+'%';
  animateBars(APP); requestAnimationFrame(()=>{ bar.style.transition=''; });
  clearInterval(clockTimer);
  if(ss.mode==='blitz'){ const el=document.getElementById('clock'); const tickc=()=>{ const t=Math.floor((Date.now()-ss.t0)/1000); el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }; tickc(); clockTimer=setInterval(tickc,1000); }
}
function isChoice(c){ return c.type==='qcm' || c.type==='sizing'; }
function dockTwo(c,ss){ return !isChoice(c) && ss.revealed; }
function dockHTML(c, ss){
  if(isChoice(c)){
    if(ss.choice==null) return `<button class="key ghost" data-act="dunno">Je ne sais pas</button>`;
    return `<button class="key go" data-act="next">${ss.i+1<ss.queue.length?'Suivant':'Terminer la séance'}</button>`;
  }
  if(!ss.revealed) return `<button class="key go" data-act="reveal">${c.type==='brain'?'Voir la solution':'Voir la réponse'}</button>`;
  return `<button class="key down" data-act="grade" data-ok="0">${tri('down')}Pas su</button><button class="key up" data-act="grade" data-ok="1">${tri('up')}Su</button>`;
}
function levelBars(l){ const n={Facile:1,Moyen:2,Difficile:3}[l]||0; return `<span class="lvlbars" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`; }
function themeCode(c){
  if(c.theme==='brain') return c.type==='sizing'?'SIZE':'PROB';
  const t = DATA.themes.find(t=>t.id===c.theme); return t?t.code:'';
}
function cardHTML(c, ss, sec, enter){
  const cls = 'card' + (enter?' enter':'');
  const bar = `<div class="card-bar"><span class="code">${esc(themeCode(c))}</span><span class="tag">${TYPE_LABEL[c.type]}</span>${c.category?`<span class="tag">${esc(c.category)}</span>`:''}${c.type==='brain'?`<span class="tag lvl">${levelBars(c.level)}${esc(c.level)}</span>`:''}</div>`;
  let body = '';
  if(c.type==='concept') body = conceptFront(c, ss.revealed) + (ss.revealed ? conceptBack(c) : '');
  else if(c.type==='open') body = openFront(c) + (ss.revealed ? openBack(c) : '');
  else if(c.type==='brain') body = brainFront(c) + (ss.revealed ? brainBack(c) : '');
  else body = choiceHTML(c, ss);
  return `<article class="${cls}" id="card">${bar}<div class="card-in">${body}</div></article>`;
}
function conceptFront(c, revealed){
  const rel = splitRelated(c.fields.related);
  const hint = c.src==='other' ? 'Formule ta réponse à voix haute, puis révèle.' : 'Récite définition, payoff ou formule, et hedge, puis révèle.';
  return `<h2 class="card-title">${esc(c.name)}</h2>
    ${rel.length?`<div class="ask"><div class="lbl">Ce qu’on te demande sur ce sujet</div><ul>${rel.map(r=>`<li>${fmt(r)}</li>`).join('')}</ul></div>`:''}
    ${!revealed?`<p class="think">${hint}</p>`:''}`;
}
function blk(label, text, extra){ return text ? `<div class="blk ${extra||''}"><div class="lbl">${label}</div><p>${fmt(text)}</p></div>` : ''; }
function conceptBack(c){
  const f = c.fields;
  if(c.src==='other') return `<div class="answer">${blk('Réponse clé', f.answer, 'ref')}</div>`;
  if(c.src==='tqa') return `<div class="answer">
    ${blk('Définition', f.definition, 'en')}
    ${blk('Formule', f.formulas, 'math')}
    ${blk('Interprétation et démonstration', f.interpretation, 'en')}
    ${blk('Réponse de référence', f.fr, 'ref')}</div>`;
  return `<div class="answer">
    ${blk('Définition', f.definition, 'en')}
    ${blk('Payoff', f.payoff, 'en')}
    ${blk('Formules clés', f.formulas, 'math')}
    ${blk('Hedging strategy', f.hedging, 'en')}
    ${blk('Réponse de référence', f.fr, 'ref')}</div>`;
}
function openFront(c){
  const banks = new Set(c.asked.map(a=>a.group)).size;
  return `<p class="card-prompt">${esc(c.prompt)}</p>
    <p class="card-sub">Question tombée ${c.asked.length} fois, chez ${banks} équipe${banks>1?'s':''} différentes.</p>
    <p class="think">Réponds à voix haute en 60 à 90 secondes, puis révèle les formulations réelles.</p>`;
}
function openBack(c){
  return `<div class="answer">
    <div class="blk"><div class="lbl">Formulations posées en entretien</div>
      <ol class="qgroup asked" style="list-style:none;padding:0;margin:0">${c.asked.map(a=>`<li><span>${esc(a.q)}<small>${esc(a.group)}</small></span></li>`).join('')}</ol></div>
    ${c.hint?`<div class="blk ref quote"><div class="lbl">Repère tiré du classeur</div><p>${fmt(c.hint.text)}</p><div class="src">Fiche : ${esc(CARDS.get(c.hint.ref).name)}</div></div>`:''}
    <div class="blk"><p class="muted" style="font-size:15px">Pas de réponse type dans le classeur : c’est ta réponse personnelle à construire.</p></div>
  </div>`;
}
function brainFront(c){
  return `<h2 class="card-title">${esc(c.title)}</h2><p class="card-prompt" style="margin-top:14px;font-weight:500;font-size:18.5px">${esc(c.prompt)}</p>
    <p class="think">Pose le raisonnement sur papier, puis révèle la solution.</p>`;
}
function brainBack(c){
  return `<div class="answer"><div class="blk ref"><div class="lbl">Réponse</div><p class="big-ans">${esc(c.answer)}</p></div>
    <div class="blk"><div class="lbl">Raisonnement</div><ol class="steps">${c.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div></div>`;
}
function choiceHTML(c, ss){
  if(!ss.order[c.id]){ const idx = c.options.map((_,i)=>i); ss.order[c.id] = c.type==='sizing' ? idx : shuffle(idx); save(); }
  const order = ss.order[c.id]; const L='ABCD';
  const answered = ss.choice!=null;
  const opts = order.map((oi,pos)=>{
    let cl='opt'; if(answered){ if(oi===c.answer) cl+=' right'; else if(oi===ss.choice) cl+=' wrong'; }
    return `<button class="${cl}" data-act="choose" data-i="${oi}" ${answered?'disabled':''}><span class="ol">${L[pos]}</span><span>${fmt(c.options[oi])}</span></button>`;
  }).join('');
  let after = '';
  if(answered){
    const ok = ss.choice===c.answer;
    const skipped = ss.choice===-1;
    after += `<div class="verdict ${ok?'ok':'ko'}">${tri(ok?'up':'down')}${ok?'Bonne réponse':skipped?'Réponse':'Pas tout à fait'}</div>`;
    if(c.type==='qcm'){
      const ref = c.expl && c.expl.ref ? CARDS.get(c.expl.ref) : null;
      after += `<div class="answer">${c.expl?`<div class="blk ref quote"><div class="lbl">Extrait du classeur</div><p>${fmt(c.expl.text)}</p><div class="src">${ref?'Fiche : '+esc(ref.name):'Question réelle : '+esc(c.source_q||'')}</div></div>`:''}
        ${c.source_q && ref?`<div class="blk"><div class="lbl">Question réelle liée</div><p style="font-size:15.5px;color:#CFCBC2">${esc(c.source_q)}</p></div>`:''}</div>`;
    } else {
      after += `<div class="answer"><div class="blk"><div class="lbl">Raisonnement de Fermi</div><ol class="steps">${c.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div>
        <div class="blk ref"><div class="lbl">Ordre de grandeur réel</div><p>${esc(c.real)}</p></div></div>`;
    }
  }
  return `<p class="card-prompt">${fmt(c.prompt)}</p><div class="opts ${answered?'done':''}">${opts}</div>${after}`;
}

function floater(ok){
  const el = document.createElement('div'); el.className='floater '+(ok?'up':'down');
  el.innerHTML = tri(ok?'up':'down') + (ok?'+1 su':'à revoir'); document.body.appendChild(el);
  setTimeout(()=>el.remove(), 750);
}
let busy = false;
function advance(){
  const ss = S.session;
  const card = document.getElementById('card');
  const next = ()=>{
    ss.i++; ss.revealed=false; ss.choice=null; save();
    if(ss.i >= ss.queue.length) return finish();
    renderPlay(true); busy=false;
  };
  if(card){ card.classList.add('leave'); setTimeout(next, 190); } else next();
}
function grade(ok){
  if(busy) return; busy = true;
  const ss = S.session; const c = currentCard();
  mark(c.id, ok); ss.res[c.id] = ok?'k':'u'; save();
  const card = document.getElementById('card');
  card.classList.add(ok?'flash-up':'flash-down'); floater(ok); haptic(ok?12:[10,40,10]);
  setTimeout(advance, 420);
}
function choose(i){
  const ss = S.session; if(ss.choice!=null) return;
  const c = currentCard(); const ok = i===c.answer;
  ss.choice = i; mark(c.id, ok); ss.res[c.id] = ok?'k':'u'; save();
  renderPlay(false);
  const card = document.getElementById('card'); card.classList.add(ok?'flash-up':'flash-down'); floater(ok); haptic(ok?12:[10,40,10]);
  setTimeout(()=>card.classList.remove('flash-up','flash-down'), 700);
  const v = APP.querySelector('.verdict'); if(v && v.scrollIntoView) setTimeout(()=>v.scrollIntoView({behavior:'smooth', block:'center'}), 120);
}
let lastSummary = null;
function finish(){
  clearInterval(clockTimer);
  const ss = S.session;
  lastSummary = {key:ss.key, mode:ss.mode, title:ss.title, res:ss.res, secs:Math.round((Date.now()-ss.t0)/1000)};
  S.session = null; save(); busy=false;
  if(ss.mode==='study') return go('#/s/'+encodeURIComponent(ss.key));
  go('#/done');
}

/* ================= summary ================= */
function renderSummary(){
  const r = lastSummary; if(!r) return go('#/');
  const ids = Object.keys(r.res); const k = ids.filter(id=>r.res[id]==='k').length; const u = ids.length-k;
  const missed = ids.filter(id=>r.res[id]==='u').map(id=>CARDS.get(id));
  const pk = ids.length? Math.round(100*k/ids.length):0;
  const time = r.secs>=60 ? `${Math.floor(r.secs/60)} min ${String(r.secs%60).padStart(2,'0')} s` : `${r.secs} s`;
  APP.innerHTML = `
  <div class="wrap">
    <div class="topbar"><button class="iconbtn" data-act="home" aria-label="Accueil">${ICON.back}</button><span class="t">${esc(r.title)}</span></div>
    <section class="sum">
      <div class="lbl">Clôture de séance${r.mode==='blitz'?' blitz':''}</div>
      <div class="score-big">${k}<small> / ${ids.length}</small></div>
      <p class="muted" style="margin:0">${pk} % de réussite en ${time}</p>
      <div class="split"><i class="k" data-w="${ids.length?100*k/ids.length:0}"></i><i class="u" data-w="${ids.length?100*u/ids.length:0}"></i></div>
      <div class="sum-legend"><span style="color:var(--up)">${tri('up')}${k} sues</span><span style="color:var(--down)">${tri('down')}${u} à revoir</span></div>
      ${missed.length?`<details class="fold" open><summary>À revoir<span class="cnt">${missed.length}</span><i class="chev"></i></summary><div class="fold-body"><ul class="cardlist">${missed.map(c=>`<li><button data-act="study-from-sum" data-id="${esc(c.id)}"><i class="dot u"></i><span class="nm">${esc(cardName(c))}</span><span class="ty">${TYPE_LABEL[c.type]}</span></button></li>`).join('')}</ul></div></details>`:''}
      <div class="plays">
        ${missed.length?`<button class="play primary" data-act="start-key" data-key="${esc(r.key)}" data-mode="errors"><span class="pk">ERR</span><span><div class="pt">Revoir mes erreurs</div><div class="pd">Toutes les erreurs de la section</div></span></button>`:''}
        <button class="play ${missed.length?'':'primary'}" data-act="start-key" data-key="${esc(r.key)}" data-mode="blitz"><span class="pk">BLZ</span><span><div class="pt">Encore un blitz</div><div class="pd">10 cartes rapides</div></span></button>
        <button class="play" data-act="open" data-key="${esc(r.key)}"><span class="pk">SEC</span><span><div class="pt">Retour à la section</div></span></button>
      </div>
    </section>
  </div>`;
  const els = APP.querySelectorAll('.split i'); requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(e=>e.style.width=e.dataset.w+'%')));
}

/* ================= modal ================= */
function confirmSheet(title, text, label, onYes){
  const m = document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML = `<div class="sheet"><div class="sheet-in"><h3>${esc(title)}</h3><p>${esc(text)}</p>
    <div class="dock-in two" style="max-width:none"><button class="key ghost" data-x="no">Annuler</button><button class="key down" data-x="yes">${esc(label)}</button></div></div></div>`;
  m.addEventListener('click', e=>{
    const b = e.target.closest('[data-x]');
    if(e.target===m || (b && b.dataset.x==='no')) m.remove();
    else if(b && b.dataset.x==='yes'){ m.remove(); onYes(); }
  });
  document.body.appendChild(m); m.querySelector('[data-x="no"]').focus();
}

/* ================= events ================= */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='mode'){ const y=window.scrollY; S.mode=b.dataset.mode; save(); renderHub(); window.scrollTo(0,y); return; }
  if(a==='open') return go('#/s/'+encodeURIComponent(b.dataset.key));
  if(a==='home') return go('#/');
  if(a==='resume') return go('#/play');
  if(a==='diff'){ S.diff=b.dataset.diff; save(); const y=window.scrollY; renderSection(decodeURIComponent(location.hash.slice(4))); window.scrollTo(0,y); return; }
  if(a==='start') return startSession(decodeURIComponent(location.hash.slice(4)), b.dataset.mode);
  if(a==='start-key') return startSession(b.dataset.key, b.dataset.mode);
  if(a==='study') return startSession(decodeURIComponent(location.hash.slice(4)), 'study', b.dataset.id);
  if(a==='study-from-sum') return startSession(lastSummary.key, 'study', b.dataset.id);
  if(a==='reveal'){ S.session.revealed=true; save(); renderPlay(false); const ans=APP.querySelector('.answer'); if(ans) setTimeout(()=>ans.scrollIntoView({behavior:'smooth',block:'start'}), 60); return; }
  if(a==='grade') return grade(b.dataset.ok==='1');
  if(a==='choose') return choose(Number(b.dataset.i));
  if(a==='dunno'){ const c=currentCard(); const ss=S.session; ss.choice=-1; mark(c.id,false); ss.res[c.id]='u'; save(); renderPlay(false); return; }
  if(a==='next'){ if(busy) return; busy=true; return advance(); }
  if(a==='quit'){ clearInterval(clockTimer); return go('#/'); }
  if(a==='reset-sec'){
    const s = SECTIONS.get(b.dataset.key);
    return confirmSheet('Réinitialiser la section ?', `La progression des ${s.cards.length} cartes de « ${s.title} » sera effacée. Les cartes partagées avec d’autres sections repartent aussi à zéro.`, 'Réinitialiser', ()=>{
      s.cards.forEach(id=>delete S.prog[id]); if(S.session && S.session.key===s.key) S.session=null; save(); renderSection(s.key);
    });
  }
  if(a==='reset-all') return confirmSheet('Tout réinitialiser ?', 'Toute la progression et la séance en cours seront effacées de cet appareil.', 'Tout effacer', ()=>{
    S.prog={}; S.session=null; save(); renderHub();
  });
});
document.addEventListener('keydown', e=>{
  if(location.hash!=='#/play' || !S.session) return;
  const c = currentCard(); if(!c) return;
  if(isChoice(c)){
    if(S.session.choice==null && /^[1-4]$/.test(e.key)){ const oi=S.session.order[c.id][Number(e.key)-1]; if(oi!=null) choose(oi); }
    else if(S.session.choice!=null && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); if(!busy){ busy=true; advance(); } }
  } else if(!S.session.revealed && (e.key===' '||e.key==='Enter')){ e.preventDefault(); S.session.revealed=true; save(); renderPlay(false); }
  else if(S.session.revealed){ if(e.key==='ArrowRight') grade(true); if(e.key==='ArrowLeft') grade(false); }
});
